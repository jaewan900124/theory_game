policy_version: 1

global_rules:
  objective: "Derive fields from game rules and game theory without directly encoding the answer."
  allowed:
    - "Current-state summaries"
    - "Action consequence maps"
    - "Risk summaries"
    - "Belief summaries only when derivable from rules plus current information"
    - "Heuristic or theoretical scores attached to actions"
    - "Unavailable markers when a quantity cannot be computed deterministically"
  forbidden:
    - "recommended_action"
    - "optimal_move"
    - "best_action"
    - "must_play_X"
    - "if condition then choose action" 
    - "precomputed argmax action as a field value"
    - "using hidden future outcome information"
    - "using terminal returns before the action is taken"
  implementation_rule: "Fields may score or describe actions, but may not decide actions."

games:
  tictactoe:
    rationale: "Perfect-information tactical board game. Tactical structure is legitimate, but direct move selection should remain outside field computation."
    low_engineering:
      allowed_fields:
        - board_reading
        - immediate_win_actions
        - immediate_block_actions
      forbidden_patterns:
        - immediate_win_actions_as_forced_answer_set
        - fork_best_move_selector
    high_engineering:
      allowed_fields:
        - board_reading
        - immediate_win_actions
        - immediate_block_actions
        - fork_creation_actions
        - fork_block_actions
        - heuristic_tiebreak_center_corner_edge
      still_forbidden:
        - recommended_move
        - solved_policy_lookup

  connect4:
    rationale: "Perfect-information gravity game. One-ply tactical fields are allowed; direct search-policy output is not."
    low_engineering:
      allowed_fields:
        - board_reconstruction
        - column_heights
        - playable_row_by_column
        - immediate_win_columns
        - immediate_block_columns
      forbidden_patterns:
        - safe_columns_as_final_answer
        - direct_minimax_move
    high_engineering:
      allowed_fields:
        - board_reconstruction
        - column_heights
        - playable_row_by_column
        - immediate_win_columns
        - immediate_block_columns
        - dangerous_moves_that_enable_opponent_win
        - heuristic_tiebreak_center_distance_by_column
      still_forbidden:
        - direct_column_choice
        - search_result_disguised_as_field

  breakthrough:
    rationale: "Race and capture structure is derivable from public state, but direct best-move selection should remain with the model."
    low_engineering:
      allowed_fields:
        - board_reconstruction
        - my_pieces
        - opponent_pieces
        - promotion_row_by_player
        - immediate_promotion_actions
        - capture_actions
      forbidden_patterns:
